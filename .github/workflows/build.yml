              fun alphaOf(NP: Double): Double {
                  if (NP < ALPHA_TABLE[0][0]) return 0.200
                  val last = ALPHA_TABLE.last(); val prev = ALPHA_TABLE[ALPHA_TABLE.size-2]
                  if (NP >= last[0]) return last[1] + (NP - last[0]) * (last[1] - prev[1]) / (last[0] - prev[0])
                  for (i in 0 until ALPHA_TABLE.size - 1) {
                      val x1 = ALPHA_TABLE[i][0]; val y1 = ALPHA_TABLE[i][1]
                      val x2 = ALPHA_TABLE[i+1][0]; val y2 = ALPHA_TABLE[i+1][1]
                      if (NP in x1..x2) return y1 + (NP - x1) * (y2 - y1) / (x2 - x1)
                  }
                  return last[1]
              }
