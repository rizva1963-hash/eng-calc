          cat > app/src/main/java/com/ar/engineering/MainActivity.kt << 'EOF'
          package com.ar.engineering

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import androidx.fragment.app.Fragment
          import com.ar.engineering.databinding.ActivityMainBinding
          import com.ar.engineering.electric.ElectricFragment
          import com.ar.engineering.water.WaterFragment

          class MainActivity : AppCompatActivity() {
              private lateinit var b: ActivityMainBinding
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  b = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(b.root)
                  if (savedInstanceState == null) show(WaterFragment())
                  b.bottomNav.setOnItemSelectedListener { item ->
                      when (item.itemId) {
                          R.id.nav_water -> { show(WaterFragment()); true }
                          R.id.nav_electric -> { show(ElectricFragment()); true }
                          else -> false
                      }
                  }
              }
              private fun show(f: Fragment) {
                  supportFragmentManager.beginTransaction().replace(R.id.container, f).commit()
              }
          }
          EOF

          cat > app/src/main/java/com/ar/engineering/ExportHelper.kt << 'EOF'
          package com.ar.engineering
          import android.content.Context
          import android.content.Intent
          import android.print.PrintAttributes
          import android.print.PrintManager
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.core.content.FileProvider
          import java.io.File
          object ExportHelper {
              fun exportPdf(context: Context, html: String, jobName: String) {
                  val webView = WebView(context)
                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView, url: String) {
                          val pm = context.getSystemService(Context.PRINT_SERVICE) as PrintManager
                          val adapter = view.createPrintDocumentAdapter(jobName)
                          pm.print(jobName, adapter, PrintAttributes.Builder()
                              .setMediaSize(PrintAttributes.MediaSize.ISO_A4).build())
                      }
                  }
                  webView.loadDataWithBaseURL(null, html, "text/html", "utf-8", null)
              }
              fun exportWord(context: Context, html: String, fileName: String) {
                  try {
                      val dir = File(context.cacheDir, "reports").apply { mkdirs() }
                      val file = File(dir, fileName)
                      file.writeText(html, Charsets.UTF_8)
                      val uri = FileProvider.getUriForFile(context, context.packageName + ".fileprovider", file)
                      val intent = Intent(Intent.ACTION_SEND).apply {
                          type = "application/msword"
                          putExtra(Intent.EXTRA_STREAM, uri)
                          putExtra(Intent.EXTRA_SUBJECT, fileName)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      context.startActivity(Intent.createChooser(intent, "Сохранить отчёт"))
                  } catch (e: Exception) {
                      Toast.makeText(context, "Ошибка: " + e.message, Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF

