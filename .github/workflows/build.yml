name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/ar/engineering/water
          mkdir -p app/src/main/res/values app/src/main/res/layout app/src/main/res/drawable
          mkdir -p app/src/main/res/menu

          cat > settings.gradle << 'XEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EngCalc"
          include ':app'
          XEOF

          cat > build.gradle << 'XEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          XEOF

          cat > gradle.properties << 'XEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          XEOF

          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'XEOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          XEOF

          cat > app/build.gradle << 'XEOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.ar.engineering'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ar.engineering"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildFeatures { viewBinding true }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.fragment:fragment-ktx:1.6.2'
          }
          XEOF

          cat > app/proguard-rules.pro << 'XEOF'
          # empty
          XEOF

          cat > app/src/main/AndroidManifest.xml << 'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.EngCalc"
                  android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XEOF

          cat > app/src/main/res/values/strings.xml << 'XEOF'
          <resources>
              <string name="app_name">Инженерные расчёты</string>
          </resources>
          XEOF

          cat > app/src/main/res/values/colors.xml << 'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#0C0C0D</color>
              <color name="panel">#17171A</color>
              <color name="panel2">#1E1E22</color>
              <color name="border">#302F2B</color>
