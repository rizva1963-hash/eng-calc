              fun alphaOf(NP: Double): Double {
                  if (NP < ALPHA_TABLE[0][0]) return 0.200
                  val last = ALPHA_TABLE.last()
                  val prev = ALPHA_TABLE[ALPHA_TABLE.size-2]
                  if (NP >= last[0]) return last[1] + (NP - last[0]) * (last[1] - prev[1]) / (last[0] - prev[0])
                  for (i in 0 until ALPHA_TABLE.size - 1) {
                      val x1 = ALPHA_TABLE[i][0]; val y1 = ALPHA_TABLE[i][1]
                      val x2 = ALPHA_TABLE[i+1][0]; val y2 = ALPHA_TABLE[i+1][1]
                      if (NP >= x1 && NP <= x2) return y1 + (NP - x1) * (y2 - y1) / (x2 - x1)
                  }
                  return last[1]
              }

              data class QsResult(val P: Double, val NP: Double, val alpha: Double, val qs: Double)
              fun qsCalc(qhrPerCap: Double, U: Double, N: Double, q0: Double): QsResult {
                  val P = if (q0 > 0 && N > 0) (qhrPerCap * U) / (q0 * N * 3600.0) else 0.0
                  val NP = N * P; val alpha = alphaOf(NP); val qs = 5 * q0 * alpha
                  return QsResult(P, NP, alpha, qs)
              }

              data class QhrResult(val Phr: Double, val NPhr: Double, val alphahr: Double, val qhr: Double)
              fun qhrCalc(P: Double, q0: Double, N: Double, q0hr: Double): QhrResult {
                  val Phr = if (q0hr > 0) (3600.0 * P * q0) / q0hr else 0.0
                  val NPhr = N * Phr; val alphahr = alphaOf(NPhr); val qhr = 0.005 * q0hr * alphahr
                  return QhrResult(Phr, NPhr, alphahr, qhr)
              }

