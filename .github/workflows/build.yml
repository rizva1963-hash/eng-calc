              data class Result(
                  val name: String,
                  val QsutC: Double, val QhrC: Double, val qsC: Double,
                  val QsutH: Double, val QhrH: Double, val qsH: Double,
                  val QsutTot: Double, val QhrTot: Double, val qsWaterTot: Double
              )

              fun compute(presetIdx: Int, qty: Double, ratio: Double,
                          q0c: Double, q0h: Double, q0tot: Double,
                          q0hrC: Double, q0hrH: Double, q0hrTot: Double): Result {
                  val p = PRESETS[presetIdx]
                  val Uday = qty
                  val Uhour = qty
                  val N = max(1.0, (Uhour * ratio).roundToInt().toDouble())
                  val qsutC = max(0.0, p.qsut - p.qsutH)
                  val qhrC = max(0.0, p.qhr - p.qhrH)
                  val QsutC = qsutC * Uday / 1000.0
                  val QsutH = p.qsutH * Uday / 1000.0
                  val QsutTot = p.qsut * Uday / 1000.0
                  val rc = qsCalc(qhrC, Uhour, N, q0c)
                  val rh = qsCalc(p.qhrH, Uhour, N, q0h)
                  val rt = qsCalc(p.qhr, Uhour, N, q0tot)
                  val hc = qhrCalc(rc.P, q0c, N, q0hrC)
                  val hh = qhrCalc(rh.P, q0h, N, q0hrH)
                  val ht = qhrCalc(rt.P, q0tot, N, q0hrTot)
                  return Result(p.name, QsutC, hc.qhr, rc.qs, QsutH, hh.qhr, rh.qs, QsutTot, ht.qhr, rt.qs)
              }

              data class Meter(val dn: Int, val qt: Double, val qmax: Double, val thr: Double, val maxDay: Int, val S: Double)
              val METERS = listOf(
                  Meter(15, 1.2, 3.0, 0.015, 45, 14.5),
                  Meter(20, 2.0, 5.0, 0.025, 70, 5.18),
                  Meter(25, 2.8, 7.0, 0.035, 100, 2.64),
                  Meter(32, 4.0, 10.0, 0.05, 140, 1.3),
                  Meter(40, 6.4, 16.0, 0.08, 230, 0.5),
                  Meter(50, 12.0, 30.0, 0.15, 450, 0.143),
                  Meter(65, 17.0, 70.0, 0.6, 610, 0.00081),
                  Meter(80, 36.0, 110.0, 0.7, 1300, 0.000264),
                  Meter(100, 65.0, 180.0, 1.2, 2350, 0.0000766)
              )

              val PIPE_DN = listOf(10,15,20,25,32,40,50,63,75,90,110,125,140,160,200,225,250,315)
          }
