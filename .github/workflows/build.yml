          package com.ar.engineering.water

          import android.os.Bundle
          import android.text.Editable
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import androidx.core.widget.doAfterTextChanged
          import androidx.fragment.app.Fragment
          import com.ar.engineering.R
          import kotlin.math.pow
          import kotlin.math.sqrt

          class WaterFragment : Fragment() {

              private var presetIdx = 0
              private var qty = 60.0
              private var ratio = 1.0
              private var q0c = 0.2; private var q0h = 0.2; private var q0tot = 0.3; private var q0s = 1.6
              private var q0hrTot = 300.0; private var q0hrC = 200.0; private var q0hrH = 200.0

              private lateinit var resultTv: TextView
              private lateinit var spPreset: Spinner

              override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?, s: Bundle?): View =
                  inflater.inflate(R.layout.fragment_water, container, false)

              override fun onViewCreated(v: View, s: Bundle?) {
                  spPreset = v.findViewById(R.id.spPreset)
                  spPreset.adapter = ArrayAdapter(requireContext(),
                      android.R.layout.simple_spinner_dropdown_item,
                      WaterCalc.PRESETS.map { it.name })
                  spPreset.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(a: AdapterView<*>?, b: View?, pos: Int, d: Long) {
                          presetIdx = pos; recalc()
                      }
                      override fun onNothingSelected(a: AdapterView<*>?) {}
                  }
                  resultTv = v.findViewById(R.id.txtResult)

                  bindField(v, R.id.edQty) { qty = it ?: 0.0 }
                  bindField(v, R.id.edRatio) { ratio = it ?: 1.0 }
                  bindField(v, R.id.edQ0c) { q0c = it ?: 0.2 }
                  bindField(v, R.id.edQ0h) { q0h = it ?: 0.2 }
                  bindField(v, R.id.edQ0tot) { q0tot = it ?: 0.3 }
                  bindField(v, R.id.edQ0s) { q0s = it ?: 1.6 }
                  bindField(v, R.id.edQ0hrTot) { q0hrTot = it ?: 300.0 }
                  bindField(v, R.id.edQ0hrC) { q0hrC = it ?: 200.0 }
                  bindField(v, R.id.edQ0hrH) { q0hrH = it ?: 200.0 }

                  recalc()
              }

              private fun bindField(v: View, id: Int, cb: (Double?) -> Unit) {
                  val e = v.findViewById<EditText>(id)
                  e.doAfterTextChanged { t: Editable? -> cb(t?.toString()?.toDoubleOrNull()); recalc() }
              }

              private fun recalc() {
                  if (!::resultTv.isInitialized) return
                  val r = WaterCalc.compute(presetIdx, qty, ratio, q0c, q0h, q0tot, q0hrC, q0hrH, q0hrTot)
                  val added = r.qsWaterTot <= 8.0
                  val qsK1 = if (added) r.qsWaterTot + q0s else r.qsWaterTot

                  val sb = StringBuilder()
                  sb.append("Потребитель: ${r.name}\n")
                  sb.append("Количество: ${qty.toInt()} × ${ratio} приборов\n\n")

                  sb.append("ХВС (В1):\n")
                  sb.append("  суточный:    %.3f м³/сут\n".format(r.QsutC))
                  sb.append("  часовой:     %.3f м³/ч\n".format(r.QhrC))
                  sb.append("  секундный:   %.3f л/с\n\n".format(r.qsC))

                  sb.append("ГВС (Т3):\n")
                  sb.append("  суточный:    %.3f м³/сут\n".format(r.QsutH))
                  sb.append("  часовой:     %.3f м³/ч\n".format(r.QhrH))
                  sb.append("  секундный:   %.3f л/с\n\n".format(r.qsH))

                  sb.append("Канализация (К1):\n")
                  sb.append("  суточный:    %.3f м³/сут\n".format(r.QsutTot))
                  sb.append("  часовой:     %.3f м³/ч\n".format(r.QhrTot))
                  if (added) sb.append("  секундный:   %.3f + %.1f = %.3f л/с\n\n".format(r.qsWaterTot, q0s, qsK1))
                  else sb.append("  секундный:   %.3f л/с\n\n".format(qsK1))

                  // Счётчик
                  val T = 24.0
                  val Qavg = r.QsutC / T
                  var chosen: WaterCalc.Meter? = null
                  for (m in WaterCalc.METERS) {
                      val isCr = m.dn <= 50
                      val hmax = if (isCr) 5.0 else 2.5
                      val loss = m.S * r.qsC.pow(2)
                      if (Qavg <= m.qt && r.QhrC <= m.qmax && loss <= hmax) { chosen = m; break }
                  }
                  if (chosen != null) {
                      val loss = chosen.S * r.qsC.pow(2)
                      sb.append("Счётчик воды (В1):\n")
                      sb.append("  среднечасовой: %.3f м³/ч (Т=24ч)\n".format(Qavg))
                      sb.append("  рекомендован:  Ду${chosen.dn} (${if (chosen.dn<=50) "крыльчатый" else "турбинный"})\n")
                      sb.append("  потери:        %.3f м\n\n".format(loss))
                  }

                  // Труба
                  val v1 = 1.0
                  val dCalc = sqrt(4 * (r.qsC/1000.0) / (Math.PI * v1)) * 1000.0
                  val dn = WaterCalc.PIPE_DN.firstOrNull { it >= dCalc } ?: WaterCalc.PIPE_DN.last()
                  val A = Math.PI * (dn/1000.0).pow(2) / 4.0
                  val vAct = (r.qsC/1000.0) / A
                  sb.append("Труба В1 (v=1,0 м/с):\n")
                  sb.append("  требуемый Ду: %.1f мм\n".format(dCalc))
                  sb.append("  стандартный:  Ду${dn}\n")
                  sb.append("  скорость:     %.2f м/с\n".format(vAct))

                  resultTv.text = sb.toString()
              }
          }
          XEOF

