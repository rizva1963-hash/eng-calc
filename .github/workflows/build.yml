                  Preset("1д Жилой дом: сидячие ванны+душ","житель",160.0,65.0,10.3,5.7,0.3,0.2,0.2),
                  Preset("1е Жилой дом: ванны 1500мм+душ","житель",180.0,70.0,11.6,6.5,0.3,0.2,0.2),
