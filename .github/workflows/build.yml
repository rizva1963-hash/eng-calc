              fun current3ph(P: Double, cosPhi: Double) = P * 1000.0 / (sqrt(3.0) * 380.0 * cosPhi)
              fun current1ph(P: Double, cosPhi: Double) = P * 1000.0 / (220.0 * cosPhi)
              fun breakerFor(I: Double): Int = BREAKERS.firstOrNull { it >= I } ?: BREAKERS.last()
              val CABLE_S = intArrayOf(16,25,35,50,70,95,120,150,185,240)
              val CABLE_AL_GROUND = intArrayOf(75,90,105,135,165,200,230,270,310,365)
              val CABLE_AL_AIR = intArrayOf(60,80,100,135,165,205,240,275,315,370)
              fun pickSection(I: Double, mat: String, lay: String): Pair<Int, Int> {
                  val base = if (lay == "ground") CABLE_AL_GROUND else CABLE_AL_AIR
                  val mult = if (mat == "cu") 1.3 else 1.0
                  val idx = base.indexOfFirst { it * mult >= I }
                  val i = if (idx == -1) base.size - 1 else idx
                  return CABLE_S[i] to (base[i] * mult).toInt()
              }
              val TRANSFORMERS = intArrayOf(25,40,63,100,160,250,400,630,1000,1600,2500)
              val HV_CABLE_S = intArrayOf(16,25,35,50,70,95,120,150,185,240)
              data class HvResult(val S: Double, val Sreq: Double, val trans: Int, val Ihv: Double, val Sc: Double, val cable: Int)
              fun hv(P: Double, cosPhi: Double, kz: Double, uhv: Double, jEk: Double): HvResult {
                  val S = P / cosPhi; val Sreq = S / kz
                  val trans = TRANSFORMERS.firstOrNull { it >= Sreq } ?: TRANSFORMERS.last()
                  val Ihv = trans * 1000.0 / (sqrt(3.0) * uhv * 1000.0)
                  val Sc = Ihv / jEk
                  val cable = HV_CABLE_S.firstOrNull { it >= Sc } ?: HV_CABLE_S.last()
                  return HvResult(S, Sreq, trans, Ihv, Sc, cable)
              }
          }
          EOF

          cat > app/src/main/java/com/ar/engineering/electric/SchemeView.kt << 'EOF'
          package com.ar.engineering.electric
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.util.AttributeSet
          import android.view.View
          import kotlin.math.max
          class SchemeView @JvmOverloads constructor(context: Context, attrs: AttributeSet? = null) : View(context, attrs) {
              data class Source(val id: String, val label: String, val power: Int, val isDgu: Boolean, val uhv: Int = 10, val hvCable: Int = 70, val lenHV: Int = 150)
              data class Feeder(val label: String, val p: Double, val breaker: Int, val cable: Int, val lenLV: Int, val source: String)
              var sources: List<Source> = emptyList() set(v) { field = v; requestLayout(); invalidate() }
              var feeders: List<Feeder> = emptyList() set(v) { field = v; requestLayout(); invalidate() }
              var useAvr: Boolean = true set(v) { field = v; invalidate() }
              private val accent = Color.parseColor("#C6A06A")
              private val accent2 = Color.parseColor("#D9B87F")
              private val ink = Color.parseColor("#EFECE5")
              private val dim = Color.parseColor("#8F8B81")
              private val dguCol = Color.parseColor("#8A9BD9")
              private val bg = Color.parseColor("#100E0C")
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = ink; textSize = 26f }
              private val smallPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = dim; textSize = 20f }
              private val boldPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = accent2; textSize = 24f; isFakeBoldText = true }
              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  setMeasuredDimension(MeasureSpec.getSize(widthMeasureSpec), 520 + max(0, feeders.size - 1) * 40)
              }
              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas); canvas.drawColor(bg)
                  if (sources.isEmpty()) return
                  val w = width.toFloat(); val colCount = sources.size
                  val colW = w / colCount
                  val colX = FloatArray(colCount) { colW * it + colW / 2 }
                  val transIdx = sources.indices.filter { !sources[it].isDgu }
                  val dguIdx = sources.indexOfFirst { it.isDgu }
                  val busY = 260f
                  val transBusX0 = if (transIdx.isNotEmpty()) colX[transIdx.first()] - 120f else 0f
                  val transBusX1 = if (transIdx.isNotEmpty()) colX[transIdx.last()] + 120f else 0f
                  sources.forEachIndexed { i, s ->
                      val x = colX[i]
                      if (!s.isDgu) {
                          paint.style = Paint.Style.STROKE; paint.color = dim; paint.strokeWidth = 1.5f
                          paint.pathEffect = android.graphics.DashPathEffect(floatArrayOf(10f, 8f), 0f)
                          canvas.drawRect(x - colW/2 + 10f, 10f, x + colW/2 - 10f, 210f, paint); paint.pathEffect = null
                          textPaint.color = ink; textPaint.textSize = 22f
                          canvas.drawText(s.label, x - 90f, 40f, textPaint)
                          paint.style = Paint.Style.STROKE; paint.color = accent; paint.strokeWidth = 3f
                          canvas.drawCircle(x, 100f, 34f, paint); canvas.drawCircle(x, 145f, 34f, paint)
                          paint.strokeWidth = 2.5f
                          canvas.drawLine(x - 18f, 118f, x + 18f, 118f, paint); canvas.drawLine(x - 18f, 128f, x + 18f, 128f, paint)
                          smallPaint.color = accent2; smallPaint.textSize = 22f; smallPaint.isFakeBoldText = true
                          canvas.drawText("ТМГ " + s.power + " кВА", x - 95f, 195f, smallPaint)
                          smallPaint.isFakeBoldText = false; smallPaint.color = dim; smallPaint.textSize = 18f
                          canvas.drawText(s.uhv.toString() + "/0,4 кВ", x - 50f, 215f, smallPaint)
                          paint.color = accent; paint.strokeWidth = 3f; canvas.drawLine(x, 178f, x, busY, paint)
                          smallPaint.color = dim; smallPaint.textSize = 16f
                          canvas.save(); canvas.rotate(-90f, x + 22f, (178f + busY) / 2)
                          canvas.drawText("АВБбШнг(А)-LS 4×" + s.hvCable + ", " + s.lenHV + "м", x + 22f, (178f + busY) / 2, smallPaint)
                          canvas.restore()
                      } else {
                          paint.style = Paint.Style.STROKE; paint.color = dguCol; paint.strokeWidth = 3f
                          canvas.drawCircle(x, 110f, 38f, paint)
                          textPaint.color = dguCol; textPaint.textSize = 34f; textPaint.isFakeBoldText = true
                          canvas.drawText("G", x - 14f, 122f, textPaint); textPaint.isFakeBoldText = false
                          textPaint.color = ink; textPaint.textSize = 20f
                          canvas.drawText(s.label, x - 70f, 175f, textPaint)
                          boldPaint.color = dguCol; boldPaint.textSize = 22f
                          canvas.drawText(s.power.toString() + " кВт", x - 55f, 198f, boldPaint)
                          paint.color = dguCol; paint.strokeWidth = 3f; canvas.drawLine(x, 148f, x, busY, paint)
                      }
                  }
                  if (transIdx.isNotEmpty()) {
                      paint.style = Paint.Style.STROKE; paint.color = accent; paint.strokeWidth = 5f
                      canvas.drawLine(transBusX0, busY, transBusX1, busY, paint)
                      if (transIdx.size > 1) {
                          val midX = (transBusX0 + transBusX1) / 2
                          paint.style = Paint.Style.FILL; paint.color = bg
                          canvas.drawRect(midX - 60f, busY - 32f, midX + 60f, busY - 2f, paint)
                          paint.style = Paint.Style.STROKE; paint.color = if (useAvr) accent else dim; paint.strokeWidth = 3f
                          canvas.drawRect(midX - 60f, busY - 32f, midX + 60f, busY - 2f, paint)
                          textPaint.color = if (useAvr) accent else dim; textPaint.textSize = 20f; textPaint.isFakeBoldText = true
                          canvas.drawText(if (useAvr) "АВР" else "вручную", midX - (if (useAvr) 22f else 42f), busY - 10f, textPaint)
                          textPaint.isFakeBoldText = false
                      }
                      smallPaint.color = dim; smallPaint.textSize = 18f
                      canvas.drawText("0,4 кВ · PEN", (transBusX0 + transBusX1) / 2 - 60f, busY + 22f, smallPaint)
                  }
                  fun drawGroup(list: List<Feeder>, x0: Float, x1: Float) {
                      if (list.isEmpty()) return
                      val step = (x1 - x0) / list.size
                      list.forEachIndexed { i, f ->
                          val x = x0 + step * i + step / 2
                          paint.color = dim; paint.strokeWidth = 2.5f
                          canvas.drawLine(x, busY, x, busY + 50f, paint)
                          paint.style = Paint.Style.STROKE; paint.color = accent; paint.strokeWidth = 3f
                          canvas.drawRect(x - 14f, busY + 50f, x + 14f, busY + 76f, paint)
                          paint.style = Paint.Style.FILL; paint.color = dim; paint.strokeWidth = 2.5f
                          canvas.drawLine(x, busY + 76f, x, busY + 110f, paint)
                          textPaint.color = ink; textPaint.textSize = 20f
                          canvas.drawText(f.label, x - textPaint.measureText(f.label) / 2, busY + 135f, textPaint)
                          boldPaint.color = accent2; boldPaint.textSize = 20f
                          val pText = "%.1f кВт · QF%dА".format(f.p, f.breaker)
                          canvas.drawText(pText, x - boldPaint.measureText(pText) / 2, busY + 160f, boldPaint)
                          smallPaint.color = dim; smallPaint.textSize = 16f
                          val cText = "4×" + f.cable + ", " + f.lenLV + "м"
                          canvas.drawText(cText, x - smallPaint.measureText(cText) / 2, busY + 182f, smallPaint)
                      }
                  }
                  val feedersTrans = feeders.filter { it.source != "dgu" }
                  val feedersDgu = feeders.filter { it.source == "dgu" }
                  if (transIdx.isNotEmpty()) {
                      val cx = (transBusX0 + transBusX1) / 2
                      val wGroup = max(transBusX1 - transBusX0, feedersTrans.size * 220f)
                      drawGroup(feedersTrans, cx - wGroup / 2, cx + wGroup / 2)
                  }
                  if (dguIdx >= 0 && feedersDgu.isNotEmpty()) {
                      val dguX = colX[dguIdx]
                      val wGroup = max(220f, feedersDgu.size * 220f)
                      drawGroup(feedersDgu, dguX - wGroup / 2, dguX + wGroup / 2)
                  }
              }
          }
          EOF

