name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/ar/engineering/water
          mkdir -p app/src/main/java/com/ar/engineering/electric
          mkdir -p app/src/main/res/values app/src/main/res/layout app/src/main/res/drawable
          mkdir -p app/src/main/res/menu app/src/main/res/xml
          mkdir -p gradle/wrapper

          cat > settings.gradle << 'XEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EngCalc"
          include ':app'
          XEOF

          cat > build.gradle << 'XEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          XEOF

          cat > gradle.properties << 'XEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          XEOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'XEOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          XEOF

          cat > app/build.gradle << 'XEOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.ar.engineering'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ar.engineering"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildFeatures { viewBinding true }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.fragment:fragment-ktx:1.6.2'
          }
          XEOF

          cat > app/proguard-rules.pro << 'XEOF'
          # empty
          XEOF

          cat > app/src/main/AndroidManifest.xml << 'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.EngCalc"
                  android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XEOF

          cat > app/src/main/res/values/strings.xml << 'XEOF'
          <resources>
              <string name="app_name">Инженерные расчёты</string>
          </resources>
          XEOF

          cat > app/src/main/res/values/colors.xml << 'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#0C0C0D</color>
              <color name="panel">#17171A</color>
              <color name="panel2">#1E1E22</color>
              <color name="border">#302F2B</color>
              <color name="ink">#EFECE5</color>
              <color name="ink2">#8F8B81</color>
              <color name="accent">#C6A06A</color>
              <color name="accent2">#D9B87F</color>
          </resources>
          XEOF

          cat > app/src/main/res/values/themes.xml << 'XEOF'
          <resources>
              <style name="Theme.EngCalc" parent="Theme.MaterialComponents.NoActionBar">
                  <item name="colorPrimary">@color/accent</item>
                  <item name="colorOnPrimary">#161310</item>
                  <item name="android:colorBackground">@color/bg</item>
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:textColorPrimary">@color/ink</item>
                  <item name="android:textColorSecondary">@color/ink2</item>
                  <item name="colorSurface">@color/panel</item>
                  <item name="android:statusBarColor">@color/bg</item>
              </style>
          </resources>
          XEOF

          cat > app/src/main/res/drawable/card_bg.xml << 'XEOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/panel"/>
              <corners android:radius="8dp"/>
              <stroke android:width="1dp" android:color="@color/border"/>
          </shape>
          XEOF

          cat > app/src/main/res/drawable/input_bg.xml << 'XEOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/panel2"/>
              <corners android:radius="6dp"/>
              <stroke android:width="1dp" android:color="@color/border"/>
          </shape>
          XEOF

          cat > app/src/main/res/drawable/btn_primary.xml << 'XEOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/accent"/>
              <corners android:radius="7dp"/>
          </shape>
          XEOF

          cat > app/src/main/res/menu/bottom_nav.xml << 'XEOF'
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_water" android:title="Вода" android:icon="@android:drawable/ic_menu_agenda"/>
              <item android:id="@+id/nav_electric" android:title="Электрика" android:icon="@android:drawable/ic_menu_manage"/>
          </menu>
          XEOF

          cat > app/src/main/res/layout/activity_main.xml << 'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:orientation="vertical"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="@color/bg">
              <FrameLayout android:id="@+id/container"
                  android:layout_width="match_parent" android:layout_height="0dp"
                  android:layout_weight="1"/>
              <com.google.android.material.bottomnavigation.BottomNavigationView
                  android:id="@+id/bottomNav"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:background="@color/panel"
                  app:menu="@menu/bottom_nav"/>
          </LinearLayout>
          XEOF

          cat > app/src/main/java/com/ar/engineering/MainActivity.kt << 'XEOF'
          package com.ar.engineering

          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.fragment.app.Fragment
          import com.google.android.material.bottomnavigation.BottomNavigationView

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  if (savedInstanceState == null) {
                      supportFragmentManager.beginTransaction()
                          .replace(R.id.container, WaterFragment()).commit()
                  }
                  findViewById<BottomNavigationView>(R.id.bottomNav)
                      .setOnItemSelectedListener { item ->
                          val f: Fragment = when (item.itemId) {
                              R.id.nav_water -> WaterFragment()
                              R.id.nav_electric -> ElectricFragment()
                              else -> return@setOnItemSelectedListener false
                          }
                          supportFragmentManager.beginTransaction()
                              .replace(R.id.container, f).commit()
                          true
                      }
              }
          }
          XEOF

          cat > app/src/main/java/com/ar/engineering/WaterFragment.kt << 'XEOF'
          package com.ar.engineering

          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView
          import androidx.fragment.app.Fragment

          class WaterFragment : Fragment() {
              override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?, s: Bundle?): View? {
                  val v = TextView(requireContext())
                  v.text = "Вода — каркас работает. Расчёты подключаются далее."
                  v.setPadding(24, 24, 24, 24)
                  v.setTextColor(0xFFEFECE5.toInt())
                  return v
              }
          }
          XEOF

          cat > app/src/main/java/com/ar/engineering/ElectricFragment.kt << 'XEOF'
          package com.ar.engineering

          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView
          import androidx.fragment.app.Fragment

          class ElectricFragment : Fragment() {
              override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?, s: Bundle?): View? {
                  val v = TextView(requireContext())
                  v.text = "Электрика — каркас работает. Расчёты подключаются далее."
                  v.setPadding(24, 24, 24, 24)
                  v.setTextColor(0xFFEFECE5.toInt())
                  return v
              }
          }
          XEOF

          echo "Files written"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.7 --no-daemon
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eng-calc-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
