                  val name: String, val unit: String,
                  val qsut: Double, val qsutH: Double, val qhr: Double, val qhrH: Double,
                  val q0tot: Double, val q0c: Double, val q0h: Double
              )

              val PRESETS = listOf(
                  Preset("1а Жилой дом: без ванн","житель",70.0,0.0,5.0,0.0,0.2,0.2,0.0),
                  Preset("1б Жилой дом: ванны+ТТ","житель",110.0,0.0,8.1,0.0,0.3,0.3,0.0),
                  Preset("1в Жилой дом: ванны+газ","житель",120.0,0.0,8.7,0.0,0.3,0.3,0.0),
